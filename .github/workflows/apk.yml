name: Build APK
on:
  push:
    paths-ignore: ['electron/**', '.github/workflows/apk.yml']  # PC-only changes do not need a new APK
  workflow_dispatch:
    inputs:
      version:
        description: 'Build the Windows exe for this existing release, e.g. 1.1.19'
        required: true
permissions:
  contents: write
jobs:
  apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Signing key (permanent, from repository secret)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            echo "PERMANENT KEY IN USE"
            echo "decoded keystore sha256: $(sha256sum ~/.android/debug.keystore | cut -c1-16)"
            keytool -list -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -i "fingerprint\|Alias\|error\|exception" || true
            echo "HOME=$HOME ANDROID_USER_HOME=$ANDROID_USER_HOME"
          else
            echo "WARNING: secret ANDROID_KEYSTORE_B64 not found - random key will be used"
          fi
      - run: |
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '1.1.${{ github.run_number }}'/" www/core.js
          grep -n "const APP_VERSION" www/core.js
          npm install --no-audit --no-fund
          npx cap add android
          node android-patch/patch.js
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Miras.apk
      - name: Verify signing certificate
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          GOT=$($AS verify --print-certs Miras.apk | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "APK certificate SHA-256: $GOT"
          if [ -n "$KS" ]; then
            WANT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
            echo "Expected (permanent key): $WANT"
            if [ "$GOT" != "$WANT" ]; then echo "ERROR: APK is NOT signed with the permanent key"; exit 1; fi
            echo "OK: signed with the permanent key"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Miras 1.1.${{ github.run_number }}
          files: Miras.apk
  exe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build Windows portable exe
        shell: bash
        run: |
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${{ github.event.inputs.version }}'/" www/core.js
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never
          ls dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: dist/Miras.exe
